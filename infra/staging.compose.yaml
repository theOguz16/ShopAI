name: shopai-staging

x-app: &app
  image: "${SHOPAI_IMAGE:?SHOPAI_IMAGE gerekli}:${RELEASE_VERSION:?RELEASE_VERSION gerekli}"
  restart: unless-stopped
  networks:
    - shopai-staging-net

x-runtime: &runtime
  DEPLOY_ENV: staging
  RELEASE_VERSION: "${RELEASE_VERSION}"
  CATALOG_MODE: postgres
  DATABASE_URL: "${STAGING_DATABASE_URL:?Ayrı staging DB gerekli}"
  REDIS_URL: "${STAGING_REDIS_URL:?Ayrı staging Redis gerekli}"
  MCP_PUBLIC_ORIGIN: "${STAGING_API_ORIGIN:?Staging API origin gerekli}"
  WIDGET_ORIGIN: "${STAGING_WIDGET_ORIGIN:?Staging widget origin gerekli}"
  MCP_ALLOWED_ORIGINS: "${STAGING_ALLOWED_ORIGINS:?Origin listesi gerekli}"
  WIDGET_RESOURCE_DOMAINS: "${STAGING_RESOURCE_DOMAINS:?Asset origin listesi gerekli}"
  REDIRECT_SIGNING_SECRET: "${STAGING_REDIRECT_SIGNING_SECRET:?Secret gerekli}"
  AUTH_PILOT_CREDENTIALS: "${STAGING_AUTH_PILOT_CREDENTIALS:?E-postaya bağlı kimlik secretı gerekli}"
  CONNECTOR_SECRET_BACKEND: openbao
  CONNECTOR_SECRET_OPENBAO_ADDRESS: https://openbao.shopai.internal:8200
  CONNECTOR_SECRET_OPENBAO_MOUNT: shopai-staging
  NODE_EXTRA_CA_CERTS: /etc/shopai/openbao-ca.crt
  LOGIN_RATE_LIMIT_MAX: "${STAGING_LOGIN_RATE_LIMIT_MAX:-5}"
  CONVERSION_CALLBACK_SECRET: "${STAGING_CONVERSION_CALLBACK_SECRET:-}"
  UPLOAD_DIR: /var/lib/shopai/uploads
  LOG_LEVEL: info

services:
  openbao-raft-permissions:
    image: busybox:1.37
    user: "0"
    restart: "no"
    command: ["chown", "100:1000", "/openbao/data"]
    volumes:
      - "staging-openbao-raft:/openbao/data"

  openbao:
    depends_on:
      openbao-raft-permissions:
        condition: service_completed_successfully
    image: openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
    restart: unless-stopped
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    security_opt:
      - no-new-privileges:true
    networks:
      shopai-staging-secrets-net:
        aliases: [openbao.shopai.internal]
    volumes:
      - "./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro"
      - "${STAGING_OPENBAO_TLS_DIR:?OpenBao TLS dizini gerekli}:/openbao/tls:ro"
      - "staging-openbao-raft:/openbao/data"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=https://openbao.shopai.internal:8200", "-ca-cert=/openbao/tls/ca.crt"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    <<: *app
    depends_on:
      openbao:
        condition: service_healthy
    networks:
      - shopai-staging-net
      - shopai-staging-secrets-net
    environment:
      <<: *runtime
      AUTH_PILOT_LOGIN_ENABLED: "${STAGING_AUTH_PILOT_LOGIN_ENABLED:-true}"
      BETTER_AUTH_ENABLED: "${STAGING_BETTER_AUTH_ENABLED:-false}"
      BETTER_AUTH_SECRET: "${STAGING_BETTER_AUTH_SECRET:-}"
      AUTH_EMAIL_FROM: "${STAGING_AUTH_EMAIL_FROM:-}"
      RESEND_API_KEY: "${STAGING_RESEND_API_KEY:-}"
      SHOPAI_ROLE: api
      CONNECTOR_SECRET_OPENBAO_ROLE_ID: "${STAGING_OPENBAO_API_ROLE_ID:?API AppRole role ID gerekli}"
      CONNECTOR_SECRET_OPENBAO_SECRET_ID_FILE: /run/secrets/openbao-role-secret-id
      HOST: 0.0.0.0
      PORT: 4000
    ports: ["127.0.0.1:4400:4000"]
    volumes:
      - "staging-private-uploads:/var/lib/shopai/uploads"
      - "${STAGING_OPENBAO_CA_CERT:?OpenBao CA certificate gerekli}:/etc/shopai/openbao-ca.crt:ro"
      - "${STAGING_OPENBAO_API_SECRET_ID_FILE:?API AppRole SecretID dosyası gerekli}:/run/secrets/openbao-role-secret-id:ro"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    depends_on:
      openbao:
        condition: service_healthy
    networks:
      - shopai-staging-net
      - shopai-staging-secrets-net
    environment:
      <<: *runtime
      SHOPAI_ROLE: worker
      CONNECTOR_SECRET_OPENBAO_ROLE_ID: "${STAGING_OPENBAO_WORKER_ROLE_ID:?Worker AppRole role ID gerekli}"
      CONNECTOR_SECRET_OPENBAO_SECRET_ID_FILE: /run/secrets/openbao-role-secret-id
    volumes:
      - "staging-private-uploads:/var/lib/shopai/uploads"
      - "${STAGING_OPENBAO_CA_CERT:?OpenBao CA certificate gerekli}:/etc/shopai/openbao-ca.crt:ro"
      - "${STAGING_OPENBAO_WORKER_SECRET_ID_FILE:?Worker AppRole SecretID dosyası gerekli}:/run/secrets/openbao-role-secret-id:ro"

  web:
    <<: *app
    environment:
      SHOPAI_ROLE: web
      DEPLOY_ENV: staging
      RELEASE_VERSION: "${RELEASE_VERSION}"
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:4300:3000"]

  widget:
    <<: *app
    environment:
      SHOPAI_ROLE: widget
      DEPLOY_ENV: staging
      RELEASE_VERSION: "${RELEASE_VERSION}"
      WIDGET_HOST: 0.0.0.0
      WIDGET_PORT: 3001
    ports: ["127.0.0.1:4500:3001"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  staging-demo-refresh:
    <<: *app
    environment:
      SHOPAI_ROLE: staging-demo-refresh
      DEPLOY_ENV: staging
      DATABASE_URL: "${STAGING_DATABASE_URL:?Ayrı staging DB gerekli}"
      WIDGET_ORIGIN: "${STAGING_WIDGET_ORIGIN:?Staging widget origin gerekli}"

  migrate:
    <<: *app
    restart: "no"
    profiles: ["migration"]
    environment:
      <<: *runtime
      SHOPAI_ROLE: migrate

volumes:
  staging-openbao-raft:
    name: shopai-staging-openbao-raft
  staging-private-uploads:
    name: shopai-staging-private-uploads

networks:
  shopai-staging-net:
    external: true
    name: shopai-staging-net
  shopai-staging-secrets-net:
    internal: true
    name: shopai-staging-secrets-net
