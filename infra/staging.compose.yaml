name: shopai-staging

x-app: &app
  image: "${SHOPAI_IMAGE:?SHOPAI_IMAGE gerekli}:${RELEASE_VERSION:?RELEASE_VERSION gerekli}"
  restart: unless-stopped

x-runtime: &runtime
  DEPLOY_ENV: staging
  RELEASE_VERSION: "${RELEASE_VERSION}"
  CATALOG_MODE: postgres
  DATABASE_URL: "${STAGING_DATABASE_URL:?Ayrı staging DB gerekli}"
  REDIS_URL: "${STAGING_REDIS_URL:?Ayrı staging Redis gerekli}"
  MCP_PUBLIC_ORIGIN: "${STAGING_API_ORIGIN:?Staging API origin gerekli}"
  WIDGET_ORIGIN: "${STAGING_WIDGET_ORIGIN:?Staging widget origin gerekli}"
  MCP_ALLOWED_ORIGINS: "${STAGING_ALLOWED_ORIGINS:?Origin listesi gerekli}"
  WIDGET_RESOURCE_DOMAINS: "${STAGING_RESOURCE_DOMAINS:?Asset origin listesi gerekli}"
  REDIRECT_SIGNING_SECRET: "${STAGING_REDIRECT_SIGNING_SECRET:?Secret gerekli}"
  AUTH_PILOT_CREDENTIALS: "${STAGING_AUTH_PILOT_CREDENTIALS:?E-postaya bağlı kimlik secretı gerekli}"
  LOGIN_RATE_LIMIT_MAX: "${STAGING_LOGIN_RATE_LIMIT_MAX:-5}"
  CONVERSION_CALLBACK_SECRET: "${STAGING_CONVERSION_CALLBACK_SECRET:-}"
  UPLOAD_DIR: /var/lib/shopai/uploads
  LOG_LEVEL: info

services:
  api:
    <<: *app
    environment:
      <<: *runtime
      SHOPAI_ROLE: api
      HOST: 0.0.0.0
      PORT: 4000
    ports: ["127.0.0.1:4400:4000"]
    volumes: ["staging-private-uploads:/var/lib/shopai/uploads"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    environment:
      <<: *runtime
      SHOPAI_ROLE: worker
    volumes: ["staging-private-uploads:/var/lib/shopai/uploads"]

  web:
    <<: *app
    environment:
      SHOPAI_ROLE: web
      DEPLOY_ENV: staging
      RELEASE_VERSION: "${RELEASE_VERSION}"
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:4300:3000"]

  widget:
    <<: *app
    environment:
      SHOPAI_ROLE: widget
      DEPLOY_ENV: staging
      RELEASE_VERSION: "${RELEASE_VERSION}"
      WIDGET_HOST: 0.0.0.0
      WIDGET_PORT: 3001
    expose: ["3001"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      STAGING_API_ORIGIN: "${STAGING_API_ORIGIN:?Staging API origin gerekli}"
      STAGING_WIDGET_ORIGIN: "${STAGING_WIDGET_ORIGIN:?Staging widget origin gerekli}"
      STAGING_TLS_EMAIL: "${STAGING_TLS_EMAIL:?ACME e-posta adresi gerekli}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./staging.Caddyfile:/etc/caddy/Caddyfile:ro
      - staging-caddy-data:/data
      - staging-caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      widget:
        condition: service_healthy

  migrate:
    <<: *app
    restart: "no"
    profiles: ["migration"]
    environment:
      <<: *runtime
      SHOPAI_ROLE: migrate

volumes:
  staging-private-uploads:
    name: shopai-staging-private-uploads
  staging-caddy-data:
    name: shopai-staging-caddy-data
  staging-caddy-config:
    name: shopai-staging-caddy-config
