name: shopai-staging

x-app: &app
  image: "${SHOPAI_IMAGE:?SHOPAI_IMAGE gerekli}:${RELEASE_VERSION:?RELEASE_VERSION gerekli}"
  restart: unless-stopped
  networks:
    - shopai-staging-net

x-runtime: &runtime
  DEPLOY_ENV: staging
  RELEASE_VERSION: "${RELEASE_VERSION}"
  CATALOG_MODE: postgres
  DATABASE_URL: "${STAGING_DATABASE_URL:?Ayrı staging DB gerekli}"
  REDIS_URL: "${STAGING_REDIS_URL:?Ayrı staging Redis gerekli}"
  MCP_PUBLIC_ORIGIN: "${STAGING_API_ORIGIN:?Staging API origin gerekli}"
  WIDGET_ORIGIN: "${STAGING_WIDGET_ORIGIN:?Staging widget origin gerekli}"
  MCP_ALLOWED_ORIGINS: "${STAGING_ALLOWED_ORIGINS:?Origin listesi gerekli}"
  WIDGET_RESOURCE_DOMAINS: "${STAGING_RESOURCE_DOMAINS:?Asset origin listesi gerekli}"
  REDIRECT_SIGNING_SECRET: "${STAGING_REDIRECT_SIGNING_SECRET:?Secret gerekli}"
  AUTH_PILOT_CREDENTIALS: "${STAGING_AUTH_PILOT_CREDENTIALS:?E-postaya bağlı kimlik secretı gerekli}"
  CONNECTOR_SECRET_BACKEND: "${STAGING_CONNECTOR_SECRET_BACKEND:-file}"
  CONNECTOR_SECRET_ENCRYPTION_KEY: "${STAGING_CONNECTOR_SECRET_ENCRYPTION_KEY:-}"
  CONNECTOR_SECRET_AWS_REGION: "${STAGING_CONNECTOR_SECRET_AWS_REGION:-}"
  CONNECTOR_SECRET_AWS_NAMESPACE: "${STAGING_CONNECTOR_SECRET_AWS_NAMESPACE:-}"
  CONNECTOR_SECRET_AWS_HEALTH_SECRET_ID: "${STAGING_CONNECTOR_SECRET_AWS_HEALTH_SECRET_ID:-}"
  CONNECTOR_SECRET_AWS_KMS_KEY_ID: "${STAGING_CONNECTOR_SECRET_AWS_KMS_KEY_ID:-}"
  LOGIN_RATE_LIMIT_MAX: "${STAGING_LOGIN_RATE_LIMIT_MAX:-5}"
  CONVERSION_CALLBACK_SECRET: "${STAGING_CONVERSION_CALLBACK_SECRET:-}"
  UPLOAD_DIR: /var/lib/shopai/uploads
  LOG_LEVEL: info

services:
  api:
    <<: *app
    environment:
      <<: *runtime
      AUTH_PILOT_LOGIN_ENABLED: "${STAGING_AUTH_PILOT_LOGIN_ENABLED:-true}"
      BETTER_AUTH_ENABLED: "${STAGING_BETTER_AUTH_ENABLED:-false}"
      BETTER_AUTH_SECRET: "${STAGING_BETTER_AUTH_SECRET:-}"
      AUTH_EMAIL_FROM: "${STAGING_AUTH_EMAIL_FROM:-}"
      RESEND_API_KEY: "${STAGING_RESEND_API_KEY:-}"
      SHOPAI_ROLE: api
      AWS_ACCESS_KEY_ID: "${STAGING_AWS_API_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${STAGING_AWS_API_SECRET_ACCESS_KEY:-}"
      HOST: 0.0.0.0
      PORT: 4000
    ports: ["127.0.0.1:4400:4000"]
    volumes: ["staging-private-uploads:/var/lib/shopai/uploads"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    environment:
      <<: *runtime
      SHOPAI_ROLE: worker
      AWS_ACCESS_KEY_ID: "${STAGING_AWS_WORKER_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${STAGING_AWS_WORKER_SECRET_ACCESS_KEY:-}"
    volumes: ["staging-private-uploads:/var/lib/shopai/uploads"]

  web:
    <<: *app
    environment:
      SHOPAI_ROLE: web
      DEPLOY_ENV: staging
      RELEASE_VERSION: "${RELEASE_VERSION}"
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:4300:3000"]

  widget:
    <<: *app
    environment:
      SHOPAI_ROLE: widget
      DEPLOY_ENV: staging
      RELEASE_VERSION: "${RELEASE_VERSION}"
      WIDGET_HOST: 0.0.0.0
      WIDGET_PORT: 3001
    ports: ["127.0.0.1:4500:3001"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  staging-demo-refresh:
    <<: *app
    environment:
      SHOPAI_ROLE: staging-demo-refresh
      DEPLOY_ENV: staging
      DATABASE_URL: "${STAGING_DATABASE_URL:?Ayrı staging DB gerekli}"
      WIDGET_ORIGIN: "${STAGING_WIDGET_ORIGIN:?Staging widget origin gerekli}"

  migrate:
    <<: *app
    restart: "no"
    profiles: ["migration"]
    environment:
      <<: *runtime
      SHOPAI_ROLE: migrate

volumes:
  staging-private-uploads:
    name: shopai-staging-private-uploads

networks:
  shopai-staging-net:
    external: true
    name: shopai-staging-net
