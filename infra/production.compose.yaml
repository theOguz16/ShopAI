name: shopai-production

x-app: &app
  image: "${SHOPAI_IMAGE:?SHOPAI_IMAGE gerekli}:${RELEASE_VERSION:?RELEASE_VERSION gerekli}"
  restart: unless-stopped
  networks:
    - shopai-production-net
  security_opt:
    - no-new-privileges:true

x-runtime: &runtime
  DEPLOY_ENV: production
  RELEASE_VERSION: "${RELEASE_VERSION}"
  CATALOG_MODE: postgres
  DATABASE_URL: "${PRODUCTION_DATABASE_URL:?Production DB gerekli}"
  REDIS_URL: "${PRODUCTION_REDIS_URL:?Production Redis gerekli}"
  MCP_PUBLIC_ORIGIN: "${PRODUCTION_API_ORIGIN:?Production API origin gerekli}"
  WIDGET_ORIGIN: "${PRODUCTION_WIDGET_ORIGIN:?Production widget origin gerekli}"
  MCP_ALLOWED_ORIGINS: "${PRODUCTION_ALLOWED_ORIGINS:?Origin listesi gerekli}"
  WIDGET_RESOURCE_DOMAINS: "${PRODUCTION_RESOURCE_DOMAINS:?Asset origin listesi gerekli}"
  REDIRECT_SIGNING_SECRET: "${PRODUCTION_REDIRECT_SIGNING_SECRET:?Redirect secret gerekli}"
  AUTH_PILOT_CREDENTIALS: "${PRODUCTION_AUTH_PILOT_CREDENTIALS:?Kimlik secretı gerekli}"
  CONNECTOR_SECRET_BACKEND: openbao
  CONNECTOR_SECRET_OPENBAO_ADDRESS: https://openbao.shopai.internal:8200
  CONNECTOR_SECRET_OPENBAO_MOUNT: shopai-production
  NODE_EXTRA_CA_CERTS: /etc/shopai/openbao-ca.crt
  OPS_ALERT_WEBHOOK_URL: "${PRODUCTION_OPS_ALERT_WEBHOOK_URL:?Ops alert webhook gerekli}"
  OPS_ALERT_WEBHOOK_SECRET: "${PRODUCTION_OPS_ALERT_WEBHOOK_SECRET:?Ops alert secret gerekli}"
  LOGIN_RATE_LIMIT_MAX: "${PRODUCTION_LOGIN_RATE_LIMIT_MAX:-5}"
  CONVERSION_CALLBACK_SECRET: "${PRODUCTION_CONVERSION_CALLBACK_SECRET:-}"
  RESEND_API_KEY: "${PRODUCTION_RESEND_API_KEY:-}"
  ALERT_FROM_EMAIL: "${PRODUCTION_ALERT_FROM_EMAIL:-}"
  UPLOAD_DIR: /var/lib/shopai/uploads
  LOG_LEVEL: info

services:
  openbao-raft-permissions:
    image: busybox:1.37
    user: "0"
    restart: "no"
    command: ["chown", "100:1000", "/openbao/data"]
    volumes:
      - "production-openbao-raft:/openbao/data"

  openbao:
    depends_on:
      openbao-raft-permissions:
        condition: service_completed_successfully
    image: openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
    restart: unless-stopped
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    security_opt:
      - no-new-privileges:true
    networks:
      shopai-production-secrets-net:
        aliases: [openbao.shopai.internal]
    volumes:
      - "./openbao/openbao.hcl:/openbao/config/openbao.hcl:ro"
      - "${PRODUCTION_OPENBAO_TLS_DIR:?OpenBao TLS dizini gerekli}:/openbao/tls:ro"
      - "production-openbao-raft:/openbao/data"
    healthcheck:
      test: ["CMD", "bao", "status", "-address=https://openbao.shopai.internal:8200", "-ca-cert=/openbao/tls/ca.crt"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    <<: *app
    depends_on:
      openbao:
        condition: service_healthy
    networks:
      - shopai-production-net
      - shopai-production-secrets-net
    environment:
      <<: *runtime
      AUTH_PILOT_LOGIN_ENABLED: "${PRODUCTION_AUTH_PILOT_LOGIN_ENABLED:-true}"
      BETTER_AUTH_ENABLED: "${PRODUCTION_BETTER_AUTH_ENABLED:-false}"
      BETTER_AUTH_SECRET: "${PRODUCTION_BETTER_AUTH_SECRET:-}"
      AUTH_EMAIL_FROM: "${PRODUCTION_AUTH_EMAIL_FROM:-}"
      SHOPAI_ROLE: api
      CONNECTOR_SECRET_OPENBAO_ROLE_ID: "${PRODUCTION_OPENBAO_API_ROLE_ID:?API AppRole role ID gerekli}"
      CONNECTOR_SECRET_OPENBAO_SECRET_ID_FILE: /run/secrets/openbao-role-secret-id
      HOST: 0.0.0.0
      PORT: 4000
    ports: ["127.0.0.1:5400:4000"]
    volumes:
      - "production-private-uploads:/var/lib/shopai/uploads"
      - "${PRODUCTION_OPENBAO_CA_CERT:?OpenBao CA certificate gerekli}:/etc/shopai/openbao-ca.crt:ro"
      - "${PRODUCTION_OPENBAO_API_SECRET_ID_FILE:?API AppRole SecretID dosyası gerekli}:/run/secrets/openbao-role-secret-id:ro"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>r.ok?r.json():Promise.reject()).then(j=>{if(j.release!==process.env.RELEASE_VERSION)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    depends_on:
      openbao:
        condition: service_healthy
    networks:
      - shopai-production-net
      - shopai-production-secrets-net
    environment:
      <<: *runtime
      SHOPAI_ROLE: worker
      CONNECTOR_SECRET_OPENBAO_ROLE_ID: "${PRODUCTION_OPENBAO_WORKER_ROLE_ID:?Worker AppRole role ID gerekli}"
      CONNECTOR_SECRET_OPENBAO_SECRET_ID_FILE: /run/secrets/openbao-role-secret-id
    volumes:
      - "production-private-uploads:/var/lib/shopai/uploads"
      - "${PRODUCTION_OPENBAO_CA_CERT:?OpenBao CA certificate gerekli}:/etc/shopai/openbao-ca.crt:ro"
      - "${PRODUCTION_OPENBAO_WORKER_SECRET_ID_FILE:?Worker AppRole SecretID dosyası gerekli}:/run/secrets/openbao-role-secret-id:ro"

  web:
    <<: *app
    environment:
      SHOPAI_ROLE: web
      DEPLOY_ENV: production
      RELEASE_VERSION: "${RELEASE_VERSION}"
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:5300:3000"]

  widget:
    <<: *app
    environment:
      SHOPAI_ROLE: widget
      DEPLOY_ENV: production
      RELEASE_VERSION: "${RELEASE_VERSION}"
      WIDGET_HOST: 0.0.0.0
      WIDGET_PORT: 3001
    ports: ["127.0.0.1:5500:3001"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    <<: *app
    restart: "no"
    profiles: ["migration"]
    environment:
      <<: *runtime
      SHOPAI_ROLE: migrate

volumes:
  production-openbao-raft:
    name: shopai-production-openbao-raft
  production-private-uploads:
    name: shopai-production-private-uploads

networks:
  shopai-production-net:
    external: true
    name: shopai-production-net
  shopai-production-secrets-net:
    internal: true
    name: shopai-production-secrets-net
