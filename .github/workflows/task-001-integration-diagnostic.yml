name: TASK-001 integration diagnostic

on:
  push:
    branches:
      - task-001-surface-transport

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shopai
          POSTGRES_PASSWORD: shopai_test
          POSTGRES_DB: shopai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopai -d shopai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATALOG_MODE: postgres
      DATABASE_URL: postgresql://shopai:shopai_test@127.0.0.1:5432/shopai_test
      REDIS_URL: redis://127.0.0.1:6379
      MCP_PUBLIC_ORIGIN: https://api.staging.shopai.example
      WIDGET_ORIGIN: https://widget.staging.shopai.example
      MCP_ALLOWED_ORIGINS: https://chatgpt.com,https://chat.openai.com
      WIDGET_RESOURCE_DOMAINS: https://widget.staging.shopai.example,https://images.staging.shopai.example
      REDIRECT_SIGNING_SECRET: ci-only-redirect-signing-key-000000000000000000
      CONVERSION_CALLBACK_SECRET: ci-only-conversion-callback-secret-000000000000000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-001-surface-transport
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Capture integration output
        run: |
          set +e
          pnpm test:integration > task-001-integration.log 2>&1
          code=$?
          echo "exit_code=$code" >> task-001-integration.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task-001-integration.log
          git commit -m "chore: capture TASK-001 integration diagnostics"
          git push origin HEAD:task-001-surface-transport
