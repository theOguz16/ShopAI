name: TASK-001 integration diagnostic

on:
  push:
    branches:
      - task-001-surface-transport

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: shopai
          POSTGRES_PASSWORD: shopai
          POSTGRES_DB: shopai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopai -d shopai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://shopai:shopai@127.0.0.1:5432/shopai
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-001-surface-transport
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Capture integration output
        run: |
          set +e
          pnpm test:integration > task-001-integration.log 2>&1
          code=$?
          echo "exit_code=$code" >> task-001-integration.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add task-001-integration.log
          git commit -m "chore: capture TASK-001 integration diagnostics"
          git push origin HEAD:task-001-surface-transport
