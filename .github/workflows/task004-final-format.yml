name: TASK-004 final format

on:
  push:
    branches:
      - task-004-merchant-onboarding-wizard

permissions:
  contents: write

jobs:
  format-task:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-004-merchant-onboarding-wizard
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome format --write apps/api/src/app.ts tests/integration/merchant-onboarding.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts tests/integration/merchant-onboarding.test.ts
          git commit -m "style: format final onboarding changes"
          git push origin HEAD:task-004-merchant-onboarding-wizard
