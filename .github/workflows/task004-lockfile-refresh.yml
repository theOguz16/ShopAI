name: TASK-004 lockfile refresh

on:
  push:
    branches:
      - task-004-merchant-onboarding-wizard

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-004-merchant-onboarding-wizard
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Regenerate lockfile importer metadata
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update lockfile for merchant onboarding"
          git push origin HEAD:task-004-merchant-onboarding-wizard
