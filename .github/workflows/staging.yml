name: Staging hosted smoke
run-name: Staging smoke ${{ inputs.release_version }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact 40-character deployed release SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      STAGING_API_ORIGIN: https://shop.fizyoflow.com
      STAGING_WIDGET_ORIGIN: https://widget.fizyoflow.com
      RELEASE_VERSION: ${{ inputs.release_version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate exact release SHA
        shell: bash
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_version must be an immutable 40-character commit SHA"
            exit 1
          fi

      - name: Run hosted MCP and widget acceptance smoke
        run: node scripts/staging-chatgpt-smoke.mjs

      - name: Verification record
        if: always()
        shell: bash
        run: |
          {
            echo "### ShopAI hosted staging verification"
            echo "- MCP: https://shop.fizyoflow.com/mcp"
            echo "- widget: https://widget.fizyoflow.com"
            echo "- exact release: $RELEASE_VERSION"
            echo "- this successful run can be supplied to Production release as staging evidence"
            echo "- real ChatGPT iframe acceptance remains a separate publication/platform gate"
          } >> "$GITHUB_STEP_SUMMARY"
