name: Staging hosted smoke

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional 40-character release SHA to verify
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      STAGING_API_ORIGIN: https://shop.fizyoflow.com
      STAGING_WIDGET_ORIGIN: https://widget.fizyoflow.com
      RELEASE_VERSION: ${{ inputs.release_version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate optional release SHA
        shell: bash
        run: |
          if [ -n "$RELEASE_VERSION" ] && ! [[ "$RELEASE_VERSION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_version must be an immutable 40-character commit SHA"
            exit 1
          fi

      - name: Run hosted MCP and widget acceptance smoke
        run: node scripts/staging-chatgpt-smoke.mjs

      - name: Verification record
        if: always()
        shell: bash
        run: |
          {
            echo "### ShopAI hosted staging verification"
            echo "- MCP: https://shop.fizyoflow.com/mcp"
            echo "- widget: https://widget.fizyoflow.com"
            echo "- requested release: ${RELEASE_VERSION:-current deployed release}"
            echo "- deploy automation: deferred to TASK-021"
            echo "- real ChatGPT iframe acceptance: deferred until publication"
          } >> "$GITHUB_STEP_SUMMARY"
