name: Staging deploy
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing immutable 40-char commit SHA to roll back to; empty builds current commit
        required: false
        type: string
concurrency:
  group: shopai-staging
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    runs-on: [self-hosted, shopai-staging]
    environment: staging
    env:
      RELEASE_VERSION: ${{ inputs.release_version || github.sha }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
      STAGING_API_ORIGIN: ${{ vars.STAGING_API_ORIGIN }}
      STAGING_WIDGET_ORIGIN: ${{ vars.STAGING_WIDGET_ORIGIN }}
      STAGING_TLS_EMAIL: ${{ vars.STAGING_TLS_EMAIL }}
      STAGING_MERCHANT_ID: ${{ vars.STAGING_MERCHANT_ID }}
      STAGING_ALLOWED_ORIGINS: ${{ vars.STAGING_ALLOWED_ORIGINS }}
      STAGING_RESOURCE_DOMAINS: ${{ vars.STAGING_RESOURCE_DOMAINS }}
      STAGING_REDIRECT_SIGNING_SECRET: ${{ secrets.STAGING_REDIRECT_SIGNING_SECRET }}
      STAGING_AUTH_PILOT_CREDENTIALS: ${{ secrets.STAGING_AUTH_PILOT_CREDENTIALS }}
      STAGING_CONVERSION_CALLBACK_SECRET: ${{ secrets.STAGING_CONVERSION_CALLBACK_SECRET }}
      BACKUP_DIR: ${{ vars.STAGING_BACKUP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve immutable image name
        shell: bash
        run: echo "SHOPAI_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/app" >> "$GITHUB_ENV"

      - name: Validate staging configuration
        run: |
          node <<'NODE'
          const required = [
            'STAGING_DATABASE_URL',
            'STAGING_REDIS_URL',
            'STAGING_API_ORIGIN',
            'STAGING_WIDGET_ORIGIN',
            'STAGING_TLS_EMAIL',
            'STAGING_ALLOWED_ORIGINS',
            'STAGING_RESOURCE_DOMAINS',
            'STAGING_REDIRECT_SIGNING_SECRET',
            'STAGING_AUTH_PILOT_CREDENTIALS',
            'BACKUP_DIR',
            'SHOPAI_IMAGE',
          ];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`${key} staging environment içinde tanımlı değil`);
          }
          if (!/^[0-9a-f]{40}$/iu.test(process.env.RELEASE_VERSION))
            throw new Error('RELEASE_VERSION immutable 40 karakter commit SHA olmalıdır');
          for (const key of ['STAGING_API_ORIGIN', 'STAGING_WIDGET_ORIGIN']) {
            const value = process.env[key];
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.origin !== value)
              throw new Error(`${key} origin-only HTTPS URL olmalıdır`);
          }
          if (process.env.STAGING_API_ORIGIN === process.env.STAGING_WIDGET_ORIGIN)
            throw new Error('API ve widget staging originleri ayrı olmalıdır');
          const allowed = process.env.STAGING_ALLOWED_ORIGINS.split(',').map((value) => value.trim());
          if (!allowed.includes('https://chatgpt.com'))
            throw new Error('STAGING_ALLOWED_ORIGINS https://chatgpt.com içermelidir');
          const resources = process.env.STAGING_RESOURCE_DOMAINS.split(',')
            .map((value) => value.trim())
            .filter(Boolean);
          for (const value of resources) {
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.origin !== value)
              throw new Error('STAGING_RESOURCE_DOMAINS yalnız origin-only HTTPS URL içermelidir');
          }
          NODE
          docker compose --file infra/staging.compose.yaml config >/dev/null

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable release
        if: inputs.release_version == ''
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL="$STAGING_API_ORIGIN" --build-arg NEXT_PUBLIC_MERCHANT_ID="$STAGING_MERCHANT_ID" --tag "$SHOPAI_IMAGE:$RELEASE_VERSION" --file infra/Dockerfile .
          docker push "$SHOPAI_IMAGE:$RELEASE_VERSION"

      - name: Pull selected release
        run: docker pull "$SHOPAI_IMAGE:$RELEASE_VERSION"

      - name: Backup before migration with PostgreSQL 17 client
        run: |
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          docker run --rm \
            --env DATABASE_URL="$STAGING_DATABASE_URL" \
            --volume "$BACKUP_DIR:/backups" \
            postgres:17-alpine \
            sh -eu -c 'umask 077; target="/backups/shopai-'"$stamp"'.dump"; pg_dump --format=custom --no-owner --no-acl --file="$target" "$DATABASE_URL"; sha256sum "$target" > "$target.sha256"'

      - name: Apply reviewed migrations once
        run: docker compose --file infra/staging.compose.yaml --profile migration run --rm migrate

      - name: Deploy API, worker, web, widget and HTTPS edge
        run: docker compose --file infra/staging.compose.yaml up --detach --no-build --remove-orphans api worker web widget edge

      - name: Wait for public HTTPS readiness
        run: |
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$STAGING_API_ORIGIN/health/ready" >/tmp/shopai-api-ready.json \
              && curl --fail --silent --show-error "$STAGING_WIDGET_ORIGIN/health/ready" >/tmp/shopai-widget-ready.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          node -e 'const body=JSON.parse(require("fs").readFileSync("/tmp/shopai-api-ready.json","utf8")); if(body.status!=="ok"||body.release!==process.env.RELEASE_VERSION) process.exit(1)'
          node -e 'const body=JSON.parse(require("fs").readFileSync("/tmp/shopai-widget-ready.json","utf8")); if(body.status!=="ok") process.exit(1)'

      - name: Hosted MCP and widget acceptance smoke
        run: node scripts/staging-chatgpt-smoke.mjs

      - name: Deployment record
        run: |
          {
            echo "### ShopAI staging"
            echo "- release: \`$RELEASE_VERSION\`"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- MCP: \`$STAGING_API_ORIGIN/mcp\`"
            echo "- widget: \`$STAGING_WIDGET_ORIGIN/assets/widget-v3.js\`"
            echo "- automated hosted smoke: PASS"
            echo "- real ChatGPT developer-mode session: manual evidence still required"
          } >> "$GITHUB_STEP_SUMMARY"
