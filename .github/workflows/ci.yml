name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record tested commit
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          echo "Tested commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Validate production deployment artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash -n infra/deploy-release.sh
          cat > /tmp/shopai-production.env <<'EOF'
          PRODUCTION_DATABASE_URL=postgresql://shopai:test@db.example/shopai
          PRODUCTION_REDIS_URL=rediss://redis.example
          PRODUCTION_API_ORIGIN=https://api.shopai.example
          PRODUCTION_WIDGET_ORIGIN=https://widget.shopai.example
          PRODUCTION_ALLOWED_ORIGINS=https://chatgpt.com,https://chat.openai.com
          PRODUCTION_RESOURCE_DOMAINS=https://widget.shopai.example,https://images.shopai.example
          PRODUCTION_REDIRECT_SIGNING_SECRET=ci-production-redirect-signing-secret-000000000000
          PRODUCTION_AUTH_PILOT_CREDENTIALS={"pilot@shopai.example":"ci-production-pilot-secret-000000"}
          PRODUCTION_CONNECTOR_SECRET_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PRODUCTION_OPS_ALERT_WEBHOOK_URL=https://alerts.shopai.example/events
          PRODUCTION_OPS_ALERT_WEBHOOK_SECRET=ci-production-ops-alert-secret-000000000000
          PRODUCTION_LOGIN_RATE_LIMIT_MAX=5
          EOF
          SHOPAI_IMAGE=ghcr.io/theoguz16/shopai \
          RELEASE_VERSION=0123456789abcdef0123456789abcdef01234567 \
            docker compose --env-file /tmp/shopai-production.env -f infra/production.compose.yaml config >/tmp/shopai-production-compose.yaml
          grep -q 'DEPLOY_ENV: production' /tmp/shopai-production-compose.yaml
          grep -q 'OPS_ALERT_WEBHOOK_URL: https://alerts.shopai.example/events' /tmp/shopai-production-compose.yaml
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shopai
          POSTGRES_PASSWORD: shopai_test
          POSTGRES_DB: shopai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopai -d shopai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATALOG_MODE: postgres
      DATABASE_URL: postgresql://shopai:shopai_test@127.0.0.1:5432/shopai_test
      REDIS_URL: redis://127.0.0.1:6379
      MCP_PUBLIC_ORIGIN: https://api.staging.shopai.example
      WIDGET_ORIGIN: https://widget.staging.shopai.example
      MCP_ALLOWED_ORIGINS: https://chatgpt.com,https://chat.openai.com
      WIDGET_RESOURCE_DOMAINS: https://widget.staging.shopai.example,https://images.staging.shopai.example
      REDIRECT_SIGNING_SECRET: ci-only-redirect-signing-key-000000000000000000
      CONVERSION_CALLBACK_SECRET: ci-only-conversion-callback-secret-000000000000000
    steps:
      - uses: actions/checkout@v4
      - name: Record tested commit
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          echo "Tested commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          pg_dump --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - name: Run TASK-023A synthetic pilot rehearsal
        env:
          PILOT_REHEARSAL_DATABASE_URL: postgresql://shopai:shopai_test@127.0.0.1:5432/shopai_pilot_rehearsal_ci
        run: pnpm pilot:rehearsal -- --mode=ci --seed=23001
      - name: Exercise backup and restore into an isolated test database
        run: |
          mkdir -p /tmp/shopai-backups
          BACKUP_DIR=/tmp/shopai-backups infra/backup.sh > /tmp/shopai-backup-path
          PGPASSWORD=shopai_test createdb --host=127.0.0.1 --username=shopai shopai_restore_test
          DATABASE_URL=postgresql://shopai:shopai_test@127.0.0.1:5432/shopai_restore_test BACKUP_FILE="$(cat /tmp/shopai-backup-path)" RESTORE_TARGET=test ALLOW_RESTORE=true infra/restore.sh